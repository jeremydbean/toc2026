services:
  game:
    build: .
    container_name: toc2026_game
    ports:
      - "9000:9000"   # MUD game (telnet)
      - "9001:9001"   # Web admin dashboard
    volumes:
      - ./player:/app/player       # Player save files (persistent)
      - ./log:/app/log             # Server logs (persistent)
      - ./backups:/app/backups     # Backup archives (persistent)
    environment:
      - PORT=9000
      - MUD_PORT=9000
      - WEB_ADMIN_PORT=9001
      - WEB_ADMIN_HOST=0.0.0.0
      # Admin operations remain disabled when this host variable is empty.
      - WEB_ADMIN_TOKEN=${WEB_ADMIN_TOKEN:-}
    # unless-stopped applies after any container-process exit, including a clean
    # in-game shutdown. Use `docker compose stop`/`down` to keep it stopped.
    restart: unless-stopped
