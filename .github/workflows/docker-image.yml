name: Docker image

# The prebuilt image the installers pull (ghcr.io/jeremydbean/toc2026), so
# a new install or an update downloads the game instead of compiling it.
# It is published only for a commit Validate passed on main: an image is
# never ahead of CI. amd64 and arm64 cover PCs, Macs (Apple Silicon and
# Intel), Raspberry Pi 4/5 and ARM cloud hosts.
#
# The first publish creates the package as private; the owner makes it
# public once (GitHub > Packages > toc2026 > Package settings > Change
# visibility). Until then the installers fall back to building locally.

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Name the image
        id: meta
        run: |
          image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          sha="$(git rev-parse HEAD)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TOC_VERSION=${{ steps.meta.outputs.short }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
