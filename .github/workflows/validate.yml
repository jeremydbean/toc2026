name: Validate

# One workflow, split so each kind of failure shows up as early as it can
# and the slow part runs in parallel:
#
#   plan            which tests this change needs (scripts/ci/classify.py)
#                   against the last commit CI vouched for         ~20 s
#   quick           source and generated-asset checks, no compiler  ~1 min
#   build           GNU89 Make build (strict warnings) + strict C17
#                   CMake build; the world loads; recovery and list
#                   iterator checks; the Make binary is handed on    ~1.5 min
#   build-sanitize  ASan/UBSan CMake build; the world loads and the
#                   server idles under the sanitizers                ~2 min
#   tests           the planned modules, in duration-balanced shards,
#                   each against the one binary `build` made
#   tests-serial    timing-sensitive modules, alone on a runner
#   sanitize-tests  live sessions against the sanitizer binary
#   deploy-gate     the verdict, always evaluated: the plan is the one
#                   this commit deserves, every job it needed succeeded,
#                   every module it selected ran exactly once and passed,
#                   no unexplained skip
#
# A change runs what its paths need (scripts/ci/classify.py has the
# policy): documentation alone runs the cheap checks and any test that
# holds a document to the code; the browser client its browser and web
# tests; the dashboard its own; anything touching C, the world, the
# harness, CI or deploy policy -- or anything the policy cannot name --
# runs everything. The comparison is with the last commit on main whose
# deploy-gate passed, never just this push's parent, so a docs commit on
# top of failing code runs that code's full suite.
#
# toc-auto-deploy (deploy/windows-vm/) ships a commit only when the job
# named deploy-gate succeeded on a push to main for that commit or one
# built on it. Rename it and the deployer stops deploying -- which is the
# safe way to fail -- until the two are changed together.

on:
  push:
    # Only main: a branch's commits are validated by its pull request, not
    # twice. The paths the live host's state sync owns never start a run:
    # paths-ignore skips a push only when every changed path matches.
    branches: [main]
    paths-ignore:
      - 'player/**'
      - 'gods/**'
      - 'log/**'
      - 'heroes/**'
      - 'corpse/**'
      - 'area/notes.txt'
      - 'area/bugs.txt'
      - 'area/ideas.txt'
      - 'area/typos.txt'
      - 'area/bugs.txt.*'
      - 'area/ideas.txt.*'
      - 'area/typos.txt.*'
      - 'area/pkilldata.txt'
      - 'area/wizlist.txt'
      - 'area/maxload.txt'
      - 'area/offense.txt'
      - 'area/relics.txt'
      - 'area/not.txt'
      - 'area/ban.txt'
      - 'area/dpsboard.txt'
      - 'area/built/**'
  pull_request:
  # A full regression whatever changed: every night, and by hand.
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run every module, whatever changed
        type: boolean
        default: true
      diagnostic:
        description: Run the tests even if the cheap checks fail (the gate still fails)
        type: boolean
        default: false

# A push while a run is going makes that run pointless: it validates code
# already replaced. Changes cancel changes; the nightly and manual runs
# have a group of their own and are never cancelled by a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'change' || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read          # the plan and the gate read past runs' verdicts

env:
  # Played against the ASan/UBSan binary: combat in the training yard, the
  # upgrade search over every reset, the Oracle's sanctum, the stash,
  # remort, Hyrule, building, the black market, the goblin, rested and
  # dailies, and a spread of old bug fixes. An ASan or UBSan report -- even
  # one written at shutdown -- fails the test that started that server.
  SANITIZE_MODULES: >-
    test_training_dummy test_compare_live test_oracle_sanctum_live test_stash
    test_remort_gear_live test_hyrule_access test_old_bug_reports
    test_building_mobs_objs test_building_wizard test_building_rooms_shops
    test_black_market test_treasure_goblin test_rested_and_dailies test_audit_leads
  # Modules that measure against the wall clock and need a machine to
  # themselves: the login throttle.
  SERIAL_MODULES: test_login_throttle
  # The most normal test shards a run uses; a partial plan uses fewer.
  SHARDS: 8
  SANITIZE_SHARDS: 3
  PYTHONUNBUFFERED: "1"
  # A full run asked for: the nightly regression, or a manual run with
  # "full" ticked.
  FORCE_FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      class: ${{ steps.plan.outputs.class }}
      build: ${{ steps.plan.outputs.build }}
      tests: ${{ steps.plan.outputs.tests }}
      serial: ${{ steps.plan.outputs.serial }}
      sanitize: ${{ steps.plan.outputs.sanitize }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      sanitize_shards: ${{ steps.plan.outputs.sanitize_shards }}
      sanitize_shard_count: ${{ steps.plan.outputs.sanitize_shard_count }}
    steps:
      # The whole history without file contents: enough to diff two trees
      # and to ask whether the trusted base is an ancestor.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide what this change needs
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-plan
          extra=()
          if [ "$FORCE_FULL" = true ]; then
            extra=(--full --full-reason "a ${{ github.event_name }} run is always full")
          fi
          python3 scripts/ci/classify.py --head "$GITHUB_SHA" "${extra[@]}" \
            --serial "$SERIAL_MODULES" --sanitize "$SANITIZE_MODULES" \
            --shards "$SHARDS" --sanitize-shards "$SANITIZE_SHARDS" \
            --out ci-plan/plan.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan/plan.json
          retention-days: 14
          if-no-files-found: error

  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whitespace check looks at what this push committed, so it
      # needs the commit the branch pointed at before it. Depth 1 is
      # enough: git diff compares trees, not history.
      - name: Fetch the push's base for the whitespace check
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}" || true

      - name: Source and generated-asset checks
        env:
          TOC_WHITESPACE_BASE: ${{ github.event.before }}
        run: bash scripts/validate.sh quick

      - name: Test inventory
        run: |
          python3 scripts/ci/run_tests.py --list | wc -l | xargs printf '%s test modules\n'
          python3 scripts/ci/run_tests.py --plan "$SHARDS" --serial "$SERIAL_MODULES"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: scripts/ci/install_deps.sh build-essential cmake libcrypt-dev zlib1g-dev ccache

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-

      - name: GNU89 build (strict warnings), world load, recovery and iterator checks
        env:
          # validate.sh does `make clean` first, on purpose -- this
          # codebase has been bitten by stale objects before -- so the
          # compiler cache is what stops that costing a full rebuild.
          CC: ccache gcc
        run: bash scripts/validate.sh build

      # The Makefile is gnu89; CMake is strict C17 with extensions off.
      # Functions visible under one are hidden under the other, so both
      # builds have to compile on every change (see AGENTS.md).
      - name: Strict C17 CMake build and world load
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          cd area && ../bin/rom --check-area

      - name: Hand the tested binary to the test jobs
        uses: actions/upload-artifact@v4
        with:
          name: toc-binary
          path: merc
          retention-days: 3
          if-no-files-found: error

  build-sanitize:
    needs: plan
    if: needs.plan.outputs.sanitize == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: scripts/ci/install_deps.sh build-essential cmake libcrypt-dev zlib1g-dev ccache

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-

      - name: Sanitizer build
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache
          cmake --build build-sanitize --parallel

      - name: Boot the full world under sanitizers
        working-directory: area
        env:
          # Leak detection is deliberately off: the world database is
          # intentionally allocated for process lifetime and never freed, so
          # leak reports here would be pure noise. Memory errors still fail.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ../bin/rom --check-area

      - name: Live startup smoke under sanitizers
        working-directory: area
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Exit 124 is the expected "still healthy when the timer fired".
          timeout 45s ../bin/rom 9999 || test "$?" -eq 124

      - name: Hand the sanitizer binary to its test jobs
        uses: actions/upload-artifact@v4
        with:
          name: toc-binary-sanitize
          path: bin/rom
          retention-days: 3
          if-no-files-found: error

  # The expensive matrix waits for the cheap checks: a failed preflight
  # stops it (unless a manual run asks for a diagnostic full run, which
  # the gate still fails). A build the plan did not need may be skipped.
  tests:
    needs: [plan, quick, build]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.tests == 'true'
      && (needs.quick.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic && needs.quick.result != 'cancelled'))
      && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.plan.outputs.build != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan

      - name: Which modules this shard runs
        id: shard
        run: |
          python3 scripts/ci/run_tests.py --plan-file ci-plan/plan.json \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}" \
            --serial "$SERIAL_MODULES" --serial-mode exclude --list-plan > shard-modules.txt
          echo "modules: $(wc -l < shard-modules.txt)"
          # lua compiles the Mudlet package's script; only its module needs it.
          if grep -qx test_mudlet_assets shard-modules.txt; then
            echo "lua=lua5.4" >> "$GITHUB_OUTPUT"
          fi

      - name: Install test dependencies
        # gdb gives a stalled server's backtrace (tests/live_mud.py).
        run: scripts/ci/install_deps.sh gcc libcrypt-dev zlib1g-dev gdb ${{ steps.shard.outputs.lua }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            webadmin/requirements.txt
            scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r webadmin/requirements.txt -r scripts/requirements.txt

      - name: Fetch the tested binary
        if: needs.plan.outputs.build == 'true'
        uses: actions/download-artifact@v4
        with:
          name: toc-binary

      - name: Require the binary
        if: needs.plan.outputs.build == 'true'
        run: |
          chmod +x merc
          test -x merc || { echo "::error::no server binary: every live test would skip"; exit 1; }

      - name: Run shard ${{ matrix.shard }} of ${{ needs.plan.outputs.shard_count }}
        run: |
          python3 scripts/ci/run_tests.py --plan-file ci-plan/plan.json \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}" \
            --serial "$SERIAL_MODULES" --serial-mode exclude --jobs 4 \
            --kind normal --label "tests ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}" \
            --results "ci-results/normal-${{ matrix.shard }}.json" \
            --artifacts ci-artifacts --step-summary

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-normal-${{ matrix.shard }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: ignore

      # Tracebacks, server output, synthetic transcripts and the test
      # world's own logs -- never real player files, which no test world
      # contains -- for the modules that failed.
      - name: Keep what the failures left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-normal-${{ matrix.shard }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  tests-serial:
    needs: [plan, quick, build]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.serial == 'true'
      && (needs.quick.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic && needs.quick.result != 'cancelled'))
      && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan

      - name: Install test dependencies
        run: scripts/ci/install_deps.sh gcc libcrypt-dev zlib1g-dev gdb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            webadmin/requirements.txt
            scripts/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r webadmin/requirements.txt -r scripts/requirements.txt

      - name: Fetch the tested binary
        uses: actions/download-artifact@v4
        with:
          name: toc-binary

      - name: Require the binary
        run: chmod +x merc && test -x merc

      - name: Run the timing-sensitive modules alone
        run: |
          python3 scripts/ci/run_tests.py --plan-file ci-plan/plan.json \
            --serial "$SERIAL_MODULES" --serial-mode only \
            --jobs 1 --kind serial --label "tests (serial)" \
            --results ci-results/serial.json --artifacts ci-artifacts --step-summary

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-serial
          path: ci-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep what the failures left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-serial
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  sanitize-tests:
    needs: [plan, quick, build-sanitize]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.sanitize == 'true'
      && (needs.quick.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.diagnostic && needs.quick.result != 'cancelled'))
      && needs.build-sanitize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.sanitize_shards) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: ci-plan

      - name: Install test dependencies
        run: scripts/ci/install_deps.sh gcc libcrypt-dev zlib1g-dev gdb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the sanitizer binary
        uses: actions/download-artifact@v4
        with:
          name: toc-binary-sanitize
          path: bin

      - name: Require the binary
        run: chmod +x bin/rom && test -x bin/rom

      # Two at a time: the sanitizer build is several times slower, and
      # four of them on a four-core runner miss the tests' reply windows.
      - name: Play real sessions under sanitizers (shard ${{ matrix.shard }} of ${{ needs.plan.outputs.sanitize_shard_count }})
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TOC_SERVER_BINARY: bin/rom
        run: |
          python3 scripts/ci/run_tests.py --plan-file ci-plan/plan.json \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.sanitize_shard_count }}" \
            --serial "" --jobs 2 --kind sanitize \
            --label "sanitizer ${{ matrix.shard }}/${{ needs.plan.outputs.sanitize_shard_count }}" \
            --results "ci-results/sanitize-${{ matrix.shard }}.json" \
            --artifacts ci-artifacts --step-summary

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-sanitize-${{ matrix.shard }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep what the failures left (sanitizer reports included)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-sanitize-${{ matrix.shard }}
          path: ci-artifacts/
          retention-days: 14
          if-no-files-found: ignore

  # The single result toc-auto-deploy reads. It runs whatever happened
  # above (always()) and fails unless the plan is the one this commit
  # deserves (recomputed here from its trusted base), every job the plan
  # needed succeeded, and the results -- each naming this commit -- prove
  # every module the plan selected ran exactly once, passed, and skipped
  # nothing CI was meant to provide. A skipped job is accepted only when
  # the plan did not ask for it; GitHub calls a skipped job a success, so
  # the job results alone would prove nothing.
  deploy-gate:
    needs: [plan, quick, build, build-sanitize, tests, tests-serial, sanitize-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch the plan
        uses: actions/download-artifact@v4
        continue-on-error: true      # no plan is the gate's to report, not a crash
        with:
          name: ci-plan
          path: ci-plan

      - name: Collect every job's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: ci-results

      - name: Decide
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/gate.py --results ci-results --needs "$NEEDS" \
            --plan ci-plan/plan.json --sha "$GITHUB_SHA" \
            --serial "$SERIAL_MODULES" --sanitize "$SANITIZE_MODULES" \
            --durations-out ci-durations.json

      # The measured module times, to refresh tests/ci_durations.json
      # (which balances the shards) when they drift.
      - name: Keep the measured durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-durations
          path: ci-durations.json
          retention-days: 30
          if-no-files-found: ignore
