name: Validate

on:
  push:
    # The live host commits player state here every five minutes. Each of
    # those used to start a full validate, which takes an hour and a half
    # and tells us nothing: no code changed. Ignore the paths the state
    # sync owns. A commit that touches code as well still runs, because
    # paths-ignore only skips when *every* changed path matches.
    paths-ignore:
      - 'player/**'
      - 'gods/**'
      - 'log/**'
      - 'heroes/**'
      - 'area/notes.txt'
      - 'area/bugs.txt'
      - 'area/ideas.txt'
      - 'area/typos.txt'
      - 'area/pkilldata'
      - 'area/wizlist'
      - 'area/maxload'
      - 'area/offense'
      - 'area/relics'
      - 'area/not'
      - 'area/ban'
  pull_request:

# A push while a run is going makes that run pointless: it is
# validating code that has already been replaced. Three commits in ten
# minutes used to mean three ninety-minute runs and one useful answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make libcrypt-dev zlib1g-dev lua5.4 ccache
          # lua5.4 is what makes the Mudlet package's Lua actually compile
          # here; without it that test skips and ships unparsed script.
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-validate-${{ github.sha }}
          restore-keys: ccache-validate-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            webadmin/requirements.txt
            scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r webadmin/requirements.txt -r scripts/requirements.txt

      - name: Run validation suite
        env:
          # validate.sh does `make clean` first, on purpose -- this
          # codebase has been bitten by stale objects before -- so the
          # compiler cache is what stops that costing a full rebuild.
          CC: ccache gcc
        run: bash scripts/validate.sh

  sanitize:
    # AddressSanitizer/UndefinedBehaviorSanitizer build. The normal suite
    # cannot see memory errors, and this codebase inherits legacy pointer
    # handling around extraction, combat, and world loading, so boot the whole
    # world under sanitizers on every push.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc make cmake libcrypt-dev zlib1g-dev ccache

      - name: Cache compiled objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-sanitize-${{ github.sha }}
          restore-keys: ccache-sanitize-

      - name: Configure sanitizer build
        run: |
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-sanitize --parallel

      - name: Boot the full world under sanitizers
        working-directory: area
        env:
          # Leak detection is deliberately off: the world database is
          # intentionally allocated for process lifetime and never freed, so
          # leak reports here would be pure noise. Memory errors still fail.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ../bin/rom --check-area

      - name: List iterator regression test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          gcc -g -fsanitize=address,undefined -Isrc \
            -o /tmp/test_list_iterator tests/test_list_iterator.c src/list.c
          /tmp/test_list_iterator

      - name: Live startup smoke under sanitizers
        working-directory: area
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          # Exit 124 is the expected "still healthy when the timer fired".
          timeout 45s ../bin/rom 9999 || test "$?" -eq 124
